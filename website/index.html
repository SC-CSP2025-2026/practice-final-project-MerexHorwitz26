<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/env.js"></script>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Random Healthy Recipe Finder</h1>
    <div class="text">
      <input
        type="text"
        name="text"
        id="searchBox"
        placeholder="Enter Type of Recipe"
      />
      <h4>Make sure to seperate type or types of recipe by a comma!</h4>
      <h4>Ex: Healthy, Meat</h4>
      <ul class="recipes-list">
        <li class="list-group-item">
          <!-- <h4>RECIPE:</h4> -->
          <div class="recipe-title"></div>
          <div class="recipe-ingredients"></div>
          <div class="recipe-instructions"></div>
        </li>
      </ul>
    </div>
  </body>
</html>
